name: Promote exact qualified model

on:
  workflow_dispatch:
    inputs:
      model_sha:
        description: Exact qualified asset commit
        type: string
        required: true
      hardware:
        description: Hardware identifier
        type: string
        required: true
      profile:
        description: Qualified profile
        type: string
        required: true
      tag:
        description: Optional immutable model alias
        type: string
        required: false
      review:
        description: Optional merged and approved model PR URL
        type: string
        required: false

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: true

permissions:
  contents: read

concurrency:
  group: model-release-${{ inputs.hardware }}
  cancel-in-progress: false

jobs:
  resolve:
    uses: ./.github/workflows/model-environment.yml
    with:
      model_sha: ${{ inputs.model_sha }}
      profile: ${{ inputs.profile }}
  promote:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: read
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.driver_sha }}
          path: driver
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.model_sha }}
          path: model
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.resolve.outputs.python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.tool_sha }}
          path: tooling
          persist-credentials: false
      - env:
          REQUIREMENTS: ${{ needs.resolve.outputs.requirements }}
        run: |
          python -m pip install -r "tooling/$REQUIREMENTS"
          python -m pip install setuptools==84.0.0 wheel==0.46.3
          python -m pip install --no-deps --no-build-isolation -e ./tooling
      - name: Revalidate, verify review and atomically promote
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_SHA: ${{ inputs.model_sha }}
          HARDWARE: ${{ inputs.hardware }}
          PROFILE: ${{ inputs.profile }}
          TAG: ${{ inputs.tag }}
          REVIEW: ${{ inputs.review }}
        run: |
          description model promote --root driver --candidate "$MODEL_SHA" --hardware "$HARDWARE" \
            --profile "$PROFILE" --tag "$TAG" --review-evidence "$REVIEW" --ci --apply
