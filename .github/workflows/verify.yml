name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements/build-py312.lock
            requirements/linux-py312.lock
      - name: The pinned CPython identity must be present
        run: |
          python - <<'PY'
          import platform
          from pathlib import Path

          pinned = Path(".python-version").read_text().strip()
          version = platform.python_version()
          if version != pinned:
              raise SystemExit(f"CI runtime identity drift: found CPython {version}, pinned {pinned}")
          print(f"runtime identity: CPython {version}, {platform.system()}/{platform.machine()}")
          PY
      - name: Install the pinned development environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements/linux-py312.lock -r requirements/build-py312.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Static checks
        run: python -m ruff check src tests tools deploy
      - name: Install the pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: The pinned Node.js identity must be present
        run: |
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          if [ "$actual" != "$expected" ]; then
            echo "CI Node.js identity drift: found $actual, pinned $expected" >&2
            exit 1
          fi
          echo "node identity: $actual"
      - name: Regression suite
        run: python -B -m unittest discover -s tests -t .

  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository (build A)
        uses: actions/checkout@v4
        with:
          path: checkout-a
      - name: Check out the repository (build B)
        uses: actions/checkout@v4
        with:
          path: checkout-b
      - name: Install the pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements/build-py312.lock
            requirements/linux-py312.lock
            requirements/windows-py312.lock
      - name: The pinned CPython identity must be present
        run: |
          python - <<'PY'
          import platform
          from pathlib import Path

          pinned = Path(".python-version").read_text().strip()
          version = platform.python_version()
          if version != pinned:
              raise SystemExit(f"CI runtime identity drift: found CPython {version}, pinned {pinned}")
          print(f"runtime identity: CPython {version}, {platform.system()}/{platform.machine()}")
          PY
      - name: Install the locked release builders
        run: python -m pip install --disable-pip-version-check -r requirements/build-py312.lock
      - name: Ambient negative control binds the release identity to the source closure
        run: |
          set -eu
          cp -r checkout-a/src /tmp/ambient-src
          python - <<'PY'
          import re
          from pathlib import Path

          init = Path("/tmp/ambient-src/description_pipeline/__init__.py")
          init.write_text(re.sub(r'__version__ = "[^"]+"', '__version__ = "0.0.0"', init.read_text()))
          PY
          (cd checkout-a && PYTHONPATH=/tmp/ambient-src python tools/build_release.py --output ../release-a --offline > ../release-a.log)
          (cd checkout-a && python - <<'PY'
          import json
          import re
          from pathlib import Path

          release = json.loads(Path("../release-a/release.json").read_text())
          source = re.search(r'__version__ = "([^"]+)"', Path("src/description_pipeline/__init__.py").read_text()).group(1)
          assert release["version"] == source, (release["version"], source)
          assert release["version"] != "0.0.0"
          PY
          )
      - name: A second checkout path builds byte-identical artifacts
        run: |
          set -eu
          (cd checkout-b && python tools/build_release.py --output ../release-b --offline > ../release-b.log)
          diff -r release-a release-b
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          for name in ("release-a", "release-b"):
              release = json.loads(Path(name, "release.json").read_text())
              for artifact, checksum in release["artifacts"].items():
                  actual = hashlib.sha256(Path(name, artifact).read_bytes()).hexdigest()
                  assert actual == checksum, (name, artifact)
          PY
      - name: The role archives resolve offline for their targets
        run: |
          set -eu
          python - <<'PY'
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          # The native (Windows) end installs this archive with no index and no extra
          # portable packages; the resolver must accept the wheel metadata as it stands.
          targets = {
              "linux": [],
              "windows": [
                  "--platform", "win_amd64",
                  "--python-version", "3.12",
                  "--implementation", "cp",
                  "--abi", "cp312",
              ],
          }
          for platform, constraints in targets.items():
              (archive,) = Path("release-a").glob(f"description-*-{platform}-cp312-x86_64.zip")
              target = Path("/tmp") / f"role-{platform}"
              with zipfile.ZipFile(archive) as source:
                  source.extractall(target)
              command = [
                  sys.executable, "-m", "pip", "install", "--dry-run", "--ignore-installed",
                  "--no-index", "--require-hashes", "--only-binary=:all:", *constraints,
                  "--find-links", str(target / "wheels"), "-r", str(target / "requirements.lock"),
              ]
              result = subprocess.run(command, capture_output=True, text=True)
              print(f"--- {platform} offline resolution (returncode {result.returncode}) ---")
              print(result.stdout, end="")
              print(result.stderr, end="")
              if result.returncode != 0:
                  raise SystemExit(f"the {platform} role archive does not resolve offline")
          PY
      - name: The Linux role archive installs in isolation outside the checkout
        run: |
          set -eu
          python -m venv /tmp/role-venv
          /tmp/role-venv/bin/python -m pip install --no-index --require-hashes --only-binary=:all: \
            --find-links /tmp/role-linux/wheels -r /tmp/role-linux/requirements.lock
          /tmp/role-venv/bin/python -m pip check
          cat > /tmp/role-identity.py <<'PY'
          import json
          import sys
          from pathlib import Path

          from description_pipeline.runtime import tool_record

          release = json.loads(Path(sys.argv[1]).read_text())
          record = tool_record("portable")
          assert record["version"] == release["version"], (record["version"], release["version"])
          assert record["release"]["source_commit"] == release["source_commit"], (
              record["release"]["source_commit"],
              release["source_commit"],
          )
          assert record["runtime"]["role"] == "portable"
          print(json.dumps({"version": record["version"], "source_commit": record["release"]["source_commit"]}))
          PY
          /tmp/role-venv/bin/python -I /tmp/role-identity.py "$PWD/release-a/release.json"
