name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install CPython 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/build-py312.lock
            requirements/linux-py312.lock
      - name: Install the pinned development environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements/linux-py312.lock -r requirements/build-py312.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Static checks
        run: python -m ruff check src tests tools deploy
      - name: Regression suite
        run: python -B -m unittest discover -s tests -t .
