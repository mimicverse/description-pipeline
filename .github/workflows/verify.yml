name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements/build-py312.lock
            requirements/linux-py312.lock
      - name: The pinned CPython identity must be present
        run: |
          python - <<'PY'
          import platform
          from pathlib import Path

          pinned = Path(".python-version").read_text().strip()
          version = platform.python_version()
          if version != pinned:
              raise SystemExit(f"CI runtime identity drift: found CPython {version}, pinned {pinned}")
          print(f"runtime identity: CPython {version}, {platform.system()}/{platform.machine()}")
          PY
      - name: Install the pinned development environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements/linux-py312.lock -r requirements/build-py312.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Static checks
        run: python -m ruff check src tests tools deploy
      - name: Bash 5.1 function capture regression
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --env LC_ALL=C \
            ubuntu:22.04 \
            bash tests/deploy/test_bash51_function_capture.sh
      - name: Install the pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: The pinned Node.js identity must be present
        run: |
          expected="v$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node --version)"
          if [ "$actual" != "$expected" ]; then
            echo "CI Node.js identity drift: found $actual, pinned $expected" >&2
            exit 1
          fi
          echo "node identity: $actual"
      - name: Install the hash-locked Airflow runtime
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW_VENV: ${{ runner.temp }}/airflow-venv
        run: |
          set -eu
          echo "AIRFLOW_HOME=$AIRFLOW_HOME" >> "$GITHUB_ENV"
          echo "AIRFLOW_VENV=$AIRFLOW_VENV" >> "$GITHUB_ENV"
          python -m venv "$AIRFLOW_VENV"
          "$AIRFLOW_VENV/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r deploy/airflow/requirements.lock
          "$AIRFLOW_VENV/bin/python" -m pip install --no-deps -e .
      - name: Regression suite
        run: |
          "$AIRFLOW_VENV/bin/python" -B -m unittest discover -s tests -t .
      - name: The Windows settle semantics (offline pwsh matrix)
        run: pwsh -NoProfile -File tests/deploy/test_instance_lifecycle.ps1

  windows-ps51:
    # The Windows lifecycle's required compatibility baseline: Desktop Windows PowerShell 5.1
    # (powershell.exe) plus the bound CPython 3.12 the stage installs with.  The Linux pwsh
    # matrix above remains a fast cross-check but is never the 5.1 proof.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: The baseline is Desktop PowerShell 5.1 with a bound CPython 3.12
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw "expected Desktop PowerShell, got $($PSVersionTable.PSEdition)" }
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)" }
          Write-Host "powershell: $($PSVersionTable.PSVersion)"
          $probe = @()
          try { $probe = @(& py -3.12 --version 2>&1) } catch { $probe = @() }
          if (-not (($probe -join ' ') -match '3\.12\.')) {
            choco install python312 --no-progress -y
          }
          $version = (& py -3.12 --version 2>&1) -join ' '
          if ($version -notmatch '3\.12\.') { throw "the bound CPython 3.12 is unavailable: $version" }
          Write-Host "bound python: $version"
      - name: The Windows settle/JSON boundary matrix (real Desktop PowerShell 5.1)
        run: powershell -NoProfile -File tests/deploy/test_instance_lifecycle.ps1
      - name: The endpoint configuration value boundary (the package reader)
        run: |
          & py -3.12 -m pip install --disable-pip-version-check --no-warn-script-location -e .
          if ($LASTEXITCODE -ne 0) { throw 'the editable install failed' }
          & py -3.12 -m unittest tests.v1.test_endpoint_config_boundary
          if ($LASTEXITCODE -ne 0) { throw 'the endpoint configuration boundary suite failed' }

  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements/build-py312.lock
            requirements/linux-py312.lock
            requirements/windows-py312.lock
      - name: The pinned CPython identity must be present
        run: |
          python - <<'PY'
          import platform
          from pathlib import Path

          pinned = Path(".python-version").read_text().strip()
          version = platform.python_version()
          if version != pinned:
              raise SystemExit(f"CI runtime identity drift: found CPython {version}, pinned {pinned}")
          print(f"runtime identity: CPython {version}, {platform.system()}/{platform.machine()}")
          PY
      - name: The second build path is a worktree of this checkout
        run: git worktree add --detach "$RUNNER_TEMP/build-b" HEAD
      - name: Install the pinned development environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements/linux-py312.lock -r requirements/build-py312.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ambient negative control binds the release identity to the source closure
        run: |
          set -eu
          cp -r src /tmp/ambient-src
          python - <<'PY'
          import re
          from pathlib import Path

          init = Path("/tmp/ambient-src/description_pipeline/__init__.py")
          init.write_text(re.sub(r'__version__ = "[^"]+"', '__version__ = "0.0.0"', init.read_text()))
          PY
          PYTHONPATH=/tmp/ambient-src python tools/build_release.py --output "$RUNNER_TEMP/release-a" > "$RUNNER_TEMP/release-a.log"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-a/release.json").read_text())
          source = re.search(r'__version__ = "([^"]+)"', Path("src/description_pipeline/__init__.py").read_text()).group(1)
          assert release["version"] == source, (release["version"], source)
          assert release["version"] != "0.0.0"
          PY
      - name: A second checkout path builds byte-identical artifacts
        run: |
          set -eu
          (cd "$RUNNER_TEMP/build-b" && python tools/build_release.py --output "$RUNNER_TEMP/release-b" > "$RUNNER_TEMP/release-b.log")
          diff -r "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"
      - name: The role archives resolve offline for their targets
        run: |
          set -eu
          python - <<'PY'
          import os
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          release = Path(os.environ["RUNNER_TEMP"]) / "release-a"
          # The native (Windows) end installs this archive with no index and no extra
          # portable packages; the resolver must accept the wheel metadata as it stands.
          targets = {
              "linux": [],
              "windows": [
                  "--platform", "win_amd64",
                  "--python-version", "3.12",
                  "--implementation", "cp",
                  "--abi", "cp312",
              ],
          }
          for platform, constraints in targets.items():
              (archive,) = release.glob(f"description-*-{platform}-cp312-x86_64.zip")
              target = Path("/tmp") / f"role-{platform}"
              with zipfile.ZipFile(archive) as source:
                  source.extractall(target)
              command = [
                  sys.executable, "-m", "pip", "install", "--dry-run", "--ignore-installed",
                  "--no-index", "--require-hashes", "--only-binary=:all:", *constraints,
                  "--find-links", str(target / "wheels"), "-r", str(target / "requirements.lock"),
              ]
              result = subprocess.run(command, capture_output=True, text=True)
              print(f"--- {platform} offline resolution (returncode {result.returncode}) ---")
              print(result.stdout, end="")
              print(result.stderr, end="")
              if result.returncode != 0:
                  raise SystemExit(f"the {platform} role archive does not resolve offline")
          PY
      - name: The real verifier binds the release and exercises the isolated install
        run: |
          set -eu
          wheel=( "$RUNNER_TEMP"/release-a/*.whl )
          python tools/verify_distribution.py "${wheel[0]}" \
            --runtime-lock deploy/airflow/requirements.lock \
            --wheelhouse /tmp/role-linux/wheels \
            --report release-verify-report.json
      - name: Record the verification runtime environment
        run: |
          set -eu
          python - <<'PY' > release-verify-environment.json
          import importlib.metadata as metadata
          import json
          import platform
          import sys

          print(json.dumps({
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "machine": platform.machine(),
              "builders": {name: metadata.version(name) for name in ("build", "setuptools", "wheel")},
          }, indent=2))
          PY
      - name: Keep the report and the environment with the run
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            release-verify-report.json
            release-verify-environment.json

  real-chain:
    # The isolated true-chain gate: real PostgreSQL (service container), real portal admission
    # through the operator HTTP surface, the six scheduled tasks, and SQL settlement assertions.
    # The mocked native endpoint is transport-only; the control fixture must be rejected by
    # verification and must never reach publication.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLATFORM_SCHEMA: platform_ci_${{ github.run_id }}
      AIRFLOW_SCHEMA: airflow_ci_${{ github.run_id }}
      SUPERVISED_DATABASE: supervised_ci_${{ github.run_id }}
      SUPERVISED_PLATFORM_SCHEMA: platform_supervised_ci_${{ github.run_id }}
      SUPERVISED_AIRFLOW_SCHEMA: airflow_supervised_ci_${{ github.run_id }}
      PLATFORM_SERVICE_DSN: postgresql://platform_service@127.0.0.1:5432/postgres
      AIRFLOW_MIGRATE_DSN: postgresql+psycopg2://airflow_migrate@127.0.0.1:5432/postgres
      AIRFLOW_RUNTIME_DSN: postgresql+psycopg2://airflow_runtime@127.0.0.1:5432/postgres
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            deploy/airflow/requirements.lock
            requirements/build-py312.lock
      - name: Install the hash-locked Airflow runtime
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW_VENV: ${{ runner.temp }}/airflow-venv
        run: |
          set -eu
          echo "AIRFLOW_HOME=$AIRFLOW_HOME" >> "$GITHUB_ENV"
          echo "AIRFLOW_VENV=$AIRFLOW_VENV" >> "$GITHUB_ENV"
          python -m venv "$AIRFLOW_VENV"
          "$AIRFLOW_VENV/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r deploy/airflow/requirements.lock
          "$AIRFLOW_VENV/bin/python" -m pip install --no-deps -e .
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Bootstrap the isolated identity (roles, the two schemas, search_path)
        run: |
          bash deploy/platform/apply.sh --bootstrap --psql psql --database postgres \
            --host 127.0.0.1 --port 5432 --user postgres \
            --platform-schema "$PLATFORM_SCHEMA" --airflow-schema "$AIRFLOW_SCHEMA"
      - name: Migrate the Airflow metadata as the migration identity
        run: |
          mkdir -p "$AIRFLOW_HOME"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="$AIRFLOW_MIGRATE_DSN" \
            "$AIRFLOW_VENV/bin/airflow" db migrate
      - name: Create the Feishu sign-in state in the migration window
        run: |
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="$AIRFLOW_MIGRATE_DSN" \
            "$AIRFLOW_VENV/bin/python" -m description_pipeline.orchestration.feishu_auth
      - name: Grant the airflow-side boundary (one owner, after the migration)
        run: |
          bash deploy/platform/apply.sh --airflow-grants --psql psql --database postgres \
            --host 127.0.0.1 --port 5432 --user postgres \
            --platform-schema "$PLATFORM_SCHEMA" --airflow-schema "$AIRFLOW_SCHEMA"
      - name: Apply the platform schema and the consumer grants as platform_migrate
        run: |
          bash deploy/platform/apply.sh --psql psql --database postgres \
            --host 127.0.0.1 --port 5432 --user platform_migrate \
            --platform-schema "$PLATFORM_SCHEMA" --airflow-schema "$AIRFLOW_SCHEMA"
      - name: Bootstrap the isolated supervised identity database
        run: |
          set -eu
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE $SUPERVISED_DATABASE"
          bash deploy/platform/apply.sh --bootstrap --psql psql --database "$SUPERVISED_DATABASE" \
            --host 127.0.0.1 --port 5432 --user postgres \
            --platform-schema "$SUPERVISED_PLATFORM_SCHEMA" \
            --airflow-schema "$SUPERVISED_AIRFLOW_SCHEMA"
      - name: Migrate the isolated supervised Airflow metadata
        run: |
          mkdir -p "$RUNNER_TEMP/supervised-airflow-home"
          AIRFLOW_HOME="$RUNNER_TEMP/supervised-airflow-home" \
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://airflow_migrate@127.0.0.1:5432/$SUPERVISED_DATABASE" \
            "$AIRFLOW_VENV/bin/airflow" db migrate
      - name: Apply the isolated supervised grants and platform schema
        run: |
          bash deploy/platform/apply.sh --airflow-grants --psql psql --database "$SUPERVISED_DATABASE" \
            --host 127.0.0.1 --port 5432 --user postgres \
            --platform-schema "$SUPERVISED_PLATFORM_SCHEMA" \
            --airflow-schema "$SUPERVISED_AIRFLOW_SCHEMA"
          bash deploy/platform/apply.sh --psql psql --database "$SUPERVISED_DATABASE" \
            --host 127.0.0.1 --port 5432 --user platform_migrate \
            --platform-schema "$SUPERVISED_PLATFORM_SCHEMA" \
            --airflow-schema "$SUPERVISED_AIRFLOW_SCHEMA"
      - name: Build the isolated supervised test wheel
        run: |
          python -m pip install --disable-pip-version-check -r requirements/build-py312.lock
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/supervised-wheel"
      - name: The supervised freeze identity proof (real Airflow 3, isolated database)
        env:
          DESCRIPTION_SUPERVISED_AIRFLOW_DSN: postgresql+psycopg2://airflow_runtime@127.0.0.1:5432/${{ env.SUPERVISED_DATABASE }}
          DESCRIPTION_SUPERVISED_PLATFORM_DSN: postgresql://platform_service@127.0.0.1:5432/${{ env.SUPERVISED_DATABASE }}
          DESCRIPTION_SUPERVISED_AIRFLOW_VENV: ${{ runner.temp }}/airflow-venv
          DESCRIPTION_SUPERVISED_EVIDENCE_DIR: ${{ runner.temp }}/supervised-evidence
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          set -o pipefail
          shopt -s nullglob
          wheels=( "$RUNNER_TEMP"/supervised-wheel/*.whl )
          [ "${#wheels[@]}" -eq 1 ] || { echo "expected exactly one supervised wheel" >&2; exit 1; }
          DESCRIPTION_SUPERVISED_WHEEL="${wheels[0]}" "$AIRFLOW_VENV/bin/python" -B -m unittest \
            tests.v1.test_supervised_freeze_identity -v 2>&1 | tee "$RUNNER_TEMP/supervised-test.log"
      - name: The failed freeze intent reconcile transaction (real PostgreSQL)
        env:
          DESCRIPTION_RECONCILE_AIRFLOW_DSN: postgresql+psycopg2://airflow_runtime@127.0.0.1:5432/${{ env.SUPERVISED_DATABASE }}
          DESCRIPTION_RECONCILE_PLATFORM_DSN: postgresql://platform_service@127.0.0.1:5432/${{ env.SUPERVISED_DATABASE }}
          DESCRIPTION_RECONCILE_EVIDENCE_DIR: ${{ runner.temp }}/reconcile-evidence
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          set -o pipefail
          "$AIRFLOW_VENV/bin/python" -B -m unittest \
            tests.v1.test_reconcile_real_postgres -v 2>&1 | tee "$RUNNER_TEMP/reconcile-test.log"
      - name: The writer to health and DAG configuration identity (real Airflow/PostgreSQL)
        env:
          DESCRIPTION_CONFIG_IDENTITY_DSN: ${{ env.AIRFLOW_RUNTIME_DSN }}
        run: |
          set -o pipefail
          "$AIRFLOW_VENV/bin/python" -B -m unittest tests.v1.test_config_identity_real_airflow -v \
            2>&1 | tee "$RUNNER_TEMP/config-identity-real-airflow.log"
          ! grep -q "skipped" "$RUNNER_TEMP/config-identity-real-airflow.log"
      - name: The negative matrix and the DAG suite under the real Airflow install
        if: always()
        run: |
          "$AIRFLOW_VENV/bin/python" -m unittest \
            tests.v1.test_airflow_dag \
            tests.v1.test_linked_run_ownership \
            tests.v1.test_recovery \
            tests.v1.test_portal \
            tests.v1.test_run_metadata
      - name: The interface-layer reuse fixtures (production store, real PostgreSQL)
        if: always()
        run: |
          "$AIRFLOW_VENV/bin/python" tools/settlement_fixtures.py \
            --report "$RUNNER_TEMP/settlement-fixtures.json"
      - name: Keep the real-chain evidence with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-chain-evidence
          path: |
            ${{ runner.temp }}/real-chain-report.json
            ${{ runner.temp }}/supervised-evidence
            ${{ runner.temp }}/reconcile-evidence
            ${{ runner.temp }}/supervised-test.log
            ${{ runner.temp }}/reconcile-test.log
            ${{ runner.temp }}/config-identity-real-airflow.log
            ${{ runner.temp }}/settlement-fixtures.json
            ${{ runner.temp }}/airflow-home/logs/smoke/*.log
            ${{ runner.temp }}/airflow-home/logs/dag_id=*/*/*/*.log
          if-no-files-found: warn
