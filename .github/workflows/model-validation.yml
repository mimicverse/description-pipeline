name: Exact model validation
run-name: qualify ${{ inputs.model_sha }} (${{ inputs.profile }})

on:
  workflow_dispatch:
    inputs:
      model_sha:
        description: Full 40-character asset commit SHA
        required: true
        type: string
      profile:
        description: Declared model profile
        required: true
        default: kinematics
        type: string

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: true

permissions:
  contents: read
  actions: read

concurrency:
  group: model-${{ inputs.model_sha }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  resolve:
    uses: ./.github/workflows/model-environment.yml
    with:
      model_sha: ${{ inputs.model_sha }}
      profile: ${{ inputs.profile }}
  validate:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.driver_sha }}
          fetch-depth: 0
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.model_sha }}
          lfs: true
          path: model
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.resolve.outputs.python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.tool_sha }}
          path: tooling
          persist-credentials: false
      - name: Install exact consumer environment
        env:
          REQUIREMENTS: ${{ needs.resolve.outputs.requirements }}
        run: |
          python -m pip install -r "tooling/$REQUIREMENTS"
          python -m pip install setuptools==84.0.0 wheel==0.46.3
          python -m pip install --no-deps --no-build-isolation -e ./tooling
      - name: Independently qualify committed assets
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: |
          description model layout --root model
          description check --root model --profile "$PROFILE" --report result/quality.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: model-qualification
          path: result/
          if-no-files-found: warn
  status:
    needs: [resolve, validate]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Attach result to the exact model SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODEL_SHA: ${{ inputs.model_sha }}
          PROFILE: ${{ inputs.profile }}
          OUTCOME: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          sha, profile = os.environ['MODEL_SHA'], os.environ['PROFILE']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[a-z][a-z0-9_-]{0,63}', profile):
              raise SystemExit('Invalid dispatched identity')
          state = 'success' if os.environ['OUTCOME'] == 'success' else 'failure'
          body = {'state': state, 'context': 'description/' + profile,
                  'description': 'Exact committed model qualification', 'target_url': os.environ['RUN_URL']}
          subprocess.run(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/statuses/' + sha,
                          '--method', 'POST', '--input', '-'], input=json.dumps(body), text=True, check=True)
          PY
