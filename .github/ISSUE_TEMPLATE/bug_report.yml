name: Bug report
description: Report a defect in the pipeline, CLI, Windows worker or generated model.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One defect per report, please. Every failure is reported as structured JSON with an exit
        code; the `message` field usually names the failing artifact or check.

        Remove credentials, secrets and proprietary CAD data before pasting logs.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`description --version`, or the exact commit for a source checkout."
      placeholder: 0.3.12
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Windows x86_64 with licensed SolidWorks
        - Windows x86_64 without SolidWorks
        - Other (described below)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source of the model
      options:
        - SolidWorks capture
        - Onshape capture
        - Existing snapshot or fixture
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
      description: Paste the JSON error and the exit code, not only a paraphrase.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The exact commands, the profile, and the shape of the model workspace.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant `build/failed/*/failure.json`, `docs/quality.json` or worker log excerpts.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I removed credentials, secrets and proprietary CAD data from what I pasted.
          required: true
        - label: I searched existing issues for the same defect, including closed ones.
          required: true
        - label: This is a defect, not a question or a feature request.
          required: true
