# pywin32 cannot be imported on Linux; native COM behaviour still needs a real Windows run.
[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
files = src, tools, tests, .github/scripts
# tools/ and tests/ both contain a solidworks_export package; namespace resolution avoids the clash
namespace_packages = True
explicit_package_bases = True
mypy_path = src, .
