[build-system]
# The wheel records its builder version in `WHEEL` (and therefore in `RECORD`), so an isolated build
# has to fetch exactly the version `requirements/linux-py312.lock` pins; a floating requirement makes
# the same commit produce different bytes on different days. `tools/build_release.py` checks the
# installed builder for the same reason. 84.0.0 is also where MANIFEST.in exclusion stops being
# bypassable through a Unicode normalization collision (CVE-2026-59890).
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mimicverse-description"
dynamic = ["version"]
description = "Reproducible CAD-to-URDF/MJCF build and independent qualification pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "MimicVerse", email = "andy.cui@mimicverse.ai" }]
keywords = ["urdf", "mjcf", "mujoco", "solidworks", "onshape", "cad", "robotics", "kinematics"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy==2.5.3", "PyYAML==6.0.3", "jsonschema==4.26.0", "packaging==26.3"]

[project.urls]
Homepage = "https://github.com/mimicverse/description-pipeline"
Repository = "https://github.com/mimicverse/description-pipeline"
Issues = "https://github.com/mimicverse/description-pipeline/issues"
Documentation = "https://github.com/mimicverse/description-pipeline/tree/main/docs"
Changelog = "https://github.com/mimicverse/description-pipeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
simulation = ["mujoco==3.13.0"]
windows = ["pywin32>=308; sys_platform == 'win32'"]
dev = ["ruff==0.16.8", "mypy==2.3.1", "build>=1.2", "types-PyYAML"]

[project.scripts]
description = "description_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "description_pipeline.__version__"}

[tool.bandit]
# `bandit -c pyproject.toml -r src tools` is the static security audit recorded with the release
# evidence.  Every skipped class is a deliberate, already-guarded pattern:
#   B101  - the remaining asserts narrow a type immediately after the real `_require`, which stays in
#           an optimised run.
#   B107  - the Onshape client takes an empty client-id default, not a secret.
#   B108  - the SSH control socket needs a short path under /tmp; tempfile creates it mode 0700.
#   B311  - retry jitter, not a cryptographic choice (tokens use `secrets`).
#   B314/B405 - ElementTree parses the URDF/MJCF this pipeline also generates.  CPython 3.12's Expat
#           rejects DTD entity expansion in milliseconds and the CLI reports parse failures as
#           diagnostics; tests/test_example_mutations.py pins both with an entity bomb and an
#           external-entity document.
#   B404/B603/B607 - subprocess runs argument lists (never a shell string) with tools resolved from
#           PATH on purpose.
skips = ["B101", "B107", "B108", "B311", "B314", "B404", "B405", "B506", "B603", "B607"]

[tool.setuptools.package-data]
description_pipeline = [
    "model/*.json",
    "verification/*.json",
    "tool-release.json",
    "templates/**/*",
    "sources/solidworks/deploy/*.ps1",
    "sources/solidworks/deploy/*.json",
    "sources/solidworks/deploy/requirements/*.lock",
    "sources/solidworks/deploy/*.py",
    "deploy/linux/*.sh",
]
