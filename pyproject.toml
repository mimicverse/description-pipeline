[build-system]
# Builder versions affect distribution bytes and are pinned in requirements/build-py312.lock.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mimicverse-description"
dynamic = ["version"]
description = "Verified SolidWorks-to-URDF delivery and automated model pull requests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "MimicVerse", email = "andy.cui@mimicverse.ai" }]
keywords = ["urdf", "solidworks", "cad", "robotics", "airflow"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # The native (Windows) endpoint closure: the COM capture, transport and tool
    # records.  The offline Windows archive resolves against exactly this base set
    # (plus its hash-pinned lock), so portable-only packages never enter it.
    "packaging==26.3",
    "pywin32==311; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/mimicverse/description-pipeline"
Repository = "https://github.com/mimicverse/description-pipeline"
Issues = "https://github.com/mimicverse/description-pipeline/issues"
Documentation = "https://github.com/mimicverse/description-pipeline/tree/main/docs"

[project.optional-dependencies]
# The portable (Linux) surface closure - model derivation, verification pages and
# uploads - plus the independent MuJoCo consumer behind the verify extra.  Together
# with the base they are exactly runtime.required_packages(role) for both roles.
portable = ["PyYAML==6.0.3", "numpy==2.5.3", "jsonschema==4.26.0", "python-multipart==0.0.32", "starlette==1.6.0", "anyio==4.15.1", "uvicorn==0.52.4", "a2wsgi==1.10.10", "websockets==16.1.1"]
verify = ["mujoco==3.13.0"]
dev = ["ruff==0.16.8", "build==1.6.1"]

[project.scripts]
description = "description_pipeline.cli:main"

[project.entry-points."airflow.plugins"]
description_pipeline = "description_pipeline.orchestration.airflow_plugin:DescriptionPipelinePlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "description_pipeline.__version__"}

[tool.setuptools.package-data]
description_pipeline = [
    "stage-contract.json",
    "model/*.json",
    "orchestration/static/*",
    "orchestration/static/vendor/*",
    "orchestration/*.json",
    "simulation/*.json",
    "tool-release.json",
]
