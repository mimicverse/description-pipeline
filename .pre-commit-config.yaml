# Optional local hooks; the complete release gate is documented in RELEASING.md.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: ["--config", "ruff.toml", "--fix"]
      - id: ruff-format
        args: ["--config", "ruff.toml"]
  - repo: local
    hooks:
      - id: quality-tests
        name: Pipeline regression suite
        entry: python -B -m unittest discover -s tests -t .
        language: system
        pass_filenames: false
        stages: [pre-push]
