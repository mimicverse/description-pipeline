# Windows development and test environment - Python 3.12 (cp312, win_amd64).
#
# The packaged worker runtime (src/description_pipeline/sources/solidworks/deploy/requirements/
# win-py312.lock) plus the tools the quality gate runs, resolved for win_amd64. Names are canonical
# (PEP 503) because the set below is generated from the resolved wheel filenames:
#
#   python -m pip download --only-binary=:all: --platform win_amd64 --python-version 3.12 \
#       --implementation cp --abi cp312 -d wheels -r requirements/win-py312-dev.lock
#
# ``--platform`` selects wheels but evaluates markers on the machine that runs the command, so a
# dependency guarded by ``os_name == "nt"`` (colorama, for build) has to be listed explicitly; an
# offline install on Windows is what proves the set is complete.
#
# CONTRIBUTING documents the two commands that consume it; tests/test_repo_hygiene.py keeps the
# versions it shares with the runtime lock from drifting.
